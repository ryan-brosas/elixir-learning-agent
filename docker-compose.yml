services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learning_agent
      POSTGRES_PASSWORD: learning_agent
      POSTGRES_DB: learning_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      LA_DB_HOST: postgres
      LA_DB_USER: learning_agent
      LA_DB_PASS: learning_agent
      LA_DB_NAME: learning_agent
      LA_HTTP_PORT: "4000"
    ports:
      - "4000:4000"
    volumes:
      - state:/state
      - skills:/agents/skills
      - "${SOURCE_VOLUME:-./sources}:/sources:ro"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    profiles: ["scale-out"]
    deploy:
      replicas: ${WORKER_REPLICAS:-0}
    environment:
      LA_DB_HOST: postgres
      LA_DB_USER: learning_agent
      LA_DB_PASS: learning_agent
      LA_DB_NAME: learning_agent
      ROLE: worker
    volumes:
      - state:/state
      - skills:/agents/skills
      - "${SOURCE_VOLUME:-./sources}:/sources:ro"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  state:
  skills: