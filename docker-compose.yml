services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: learning_agent
      POSTGRES_PASSWORD: learning_agent
      POSTGRES_DB: learning_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    network_mode: host
    environment:
      LA_DB_HOST: 127.0.0.1
      LA_DB_PORT: "5433"
      LA_DB_USER: learning_agent
      LA_DB_PASS: learning_agent
      LA_DB_NAME: learning_agent
      LA_HTTP_PORT: "4000"
      LA_MODEL_BASE_URL: ${LA_MODEL_BASE_URL:-}
      LA_MODEL: ${LA_MODEL:-}
      LA_MODEL_API_KEY: ${LA_MODEL_API_KEY:-}
      LA_MODEL_TIMEOUT_MS: ${LA_MODEL_TIMEOUT_MS:-120000}
      LA_MODEL_RETRY_LIMIT: ${LA_MODEL_RETRY_LIMIT:-100}
      LA_VIEWER_TOKEN: ${LA_VIEWER_TOKEN:-}
      LA_OPERATOR_TOKEN: ${LA_OPERATOR_TOKEN:-}
      LA_ADMIN_TOKEN: ${LA_ADMIN_TOKEN:-}
      LA_LOCAL_DOGFOOD: ${LA_LOCAL_DOGFOOD:-true}
      LA_SKILLS_ROOT: /agents/skills
      LA_SOURCE_ROOT: /sources
      LA_MAX_AUTO_PASSES: ${LA_MAX_AUTO_PASSES:-0}
      LA_WORKER_SLOTS: ${LA_WORKER_SLOTS:-1}
      LA_CBM_HOST: ${LA_CBM_HOST:-127.0.0.1}
      LA_CBM_PORT: ${LA_CBM_PORT:-9749}
      LA_OV_HOST: ${LA_OV_HOST:-127.0.0.1}
      LA_OV_PORT: ${LA_OV_PORT:-1933}
    volumes:
      - state:/state
      - "./data:/app/data"
      - "${SKILLS_VOLUME:-./.agents/skills}:/agents/skills"
      - "./skills-data:/mnt/ssd/work/project/elixir-learning-agent/skills-data:ro"
      - "${SOURCE_VOLUME:-./sources}:/sources:ro"
      - "/mnt/hdd/utopia/inspo:/mnt/hdd/utopia/inspo:ro"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    profiles: ["scale-out"]
    deploy:
      replicas: ${WORKER_REPLICAS:-0}
    environment:
      LA_DB_HOST: postgres
      LA_DB_USER: learning_agent
      LA_DB_PASS: learning_agent
      LA_DB_NAME: learning_agent
      ROLE: worker
    volumes:
      - state:/state
      - "${SKILLS_VOLUME:-./.agents/skills}:/agents/skills"
      - "${SOURCE_VOLUME:-./sources}:/sources:ro"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  state: